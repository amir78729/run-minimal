name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, Format, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Check code formatting (oxfmt)
        run: pnpm run format:check

      - name: Run linter (oxlint)
        run: pnpm run lint

      - name: Run tests with 100% coverage
        run: pnpm run test:coverage

      - name: Check changeset status
        if: github.event_name == 'pull_request'
        run: pnpm run changeset:check
